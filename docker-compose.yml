services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    # The tunnel routes to this name.
    container_name: notebox

    restart: unless-stopped

    env_file:
      - config.env

    # No `ports:` on the VPS — the tunnel reaches the container over the edge
    # network. Uncomment for local/off-VPS runs where there is no edge network.
    # ports:
    #   - "4100:4100"
    networks:
      - edge

    volumes:
      - ./data:/app/data

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4100/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  edge:
    external: true
